# ===============================
# SQL Server
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QLBanHangOnline;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sapassword
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Server dialect — Hibernate 6 tự detect nhưng khai báo rõ để chắc chắn
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===============================
# JWT
# ===============================
app.jwt.secret=EcommerceJwtSecretKeyForAuthenticationMustBeAtLeast32BytesLong!
app.jwt.expiration-ms=86400000
